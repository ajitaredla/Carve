# carve-generator — Carve's retail-readiness content writer (task 5.1)
#
# Managed Agents agent config. Apply with the `ant` CLI (control plane):
#   ant beta:agents create < agents/carve-generator.agent.yaml
# or the equivalent SDK/curl call. Store the returned agent id (see .env.example
# → CARVE_GENERATOR_AGENT_ID). model/system/tools/mcp_servers live HERE, on the
# agent, never on the session — the Server Action (task 6.0) only references this
# agent by id when it creates a per-request session.
#
# Cheapest current tier ($1/$5 per M tokens). This is Carve's explicit cost
# choice for both agents — Managed Agents supports all Claude 4.5+ models.
name: carve-generator
model: claude-haiku-4-5

# ---------------------------------------------------------------------------
# System prompt — the structural enforcement of PRD §7 Accuracy
# ("AI ... never invents factual retailer requirements"). The agent LOOKS UP
# facts through the Carve MCP tools rather than being handed them in a prompt
# it could drift from.
# ---------------------------------------------------------------------------
system: |
  You are Carve's retail-readiness content writer. You write specific,
  plain-language content that helps consumer-brand founders get onto retail
  shelves: blocker statements, cost-waterfall verdicts, and the retailer
  submission documents in Carve's product (KeHE/UNFI applications, Sprouts
  checklists, Whole Foods pitch briefs, sell-sheet outlines, buyer outreach
  emails).

  ALWAYS call your tools to fetch the current, real data before you write —
  never rely on prior knowledge of a specific retailer's requirements or a
  brand's numbers. Both change, and your training data is not the source of
  truth; the tools are. Concretely, before writing anything:

  - Call get_retailer_requirements(retailerSlug) to get the retailer's current
    certification, margin, timing, velocity, and fulfillment requirements.
    Never state a retailer's minimum margin %, required certification, or
    submission deadline from memory.
  - Call get_brand_context(brandId) to ground the content in the brand's real
    profile, scores, and single blocker.
  - Call run_waterfall_calculator(...) when the content references unit
    economics or the investor verdict, passing the exact input values you were
    given — do not estimate, round, or reconstruct them.

  State every number, certification name, program name, and deadline EXACTLY as
  your tools return it. If a tool call fails or returns no data, say so and stop
  — do not guess or invent a plausible-looking requirement to fill the gap. A
  missing fact is a blocker to surface, never a blank to improvise over.

  Write in clear, direct, founder-facing language. No hype, no filler.

# ---------------------------------------------------------------------------
# MCP server — the Carve MCP server (app/api/mcp/route.ts). Auth is NOT here:
# the server uses a single shared static bearer token, held in a Managed Agents
# Vault as a `static_bearer` credential keyed by this exact url, and attached to
# the session via vault_ids (task 5.4). The Vault matches the credential to this
# server by url, so the url below and the credential's mcp_server_url MUST match
# byte-for-byte once the app is deployed.
#
# ⚠️ PLACEHOLDER URL — the Carve MCP server is not yet deployed to a public
# HTTPS endpoint (no deploy task exists yet; only local `next dev`). Managed
# Agents reaches this url from Anthropic's infrastructure at session time, so
# `localhost` will not work. UPDATE THIS to the real deployed origin
# (e.g. https://<carve-app-domain>/api/mcp) before running any real session,
# and update the matching Vault credential's mcp_server_url to the same value.
mcp_servers:
  - type: url
    name: carve-data
    url: https://carve-mcp-not-yet-deployed.example.com/api/mcp

# Grant the agent the full toolset exposed by the carve-data MCP server
# (get_retailer_requirements, run_waterfall_calculator, get_brand_context,
# get_verification_facts). mcp_server_name must match the mcp_servers entry
# above.
#
# permission_policy: always_allow is set explicitly. The API defaults an
# mcp_toolset to `always_ask`, which pauses the session on every tool call
# awaiting a user.tool_confirmation event. Carve's Server Action (task 6.0)
# drives these sessions autonomously (create -> stream -> drain to idle) with no
# human in the loop, so always_ask would deadlock the flow. These four tools are
# read-only, so auto-allow is both safe and required here.
tools:
  - type: mcp_toolset
    mcp_server_name: carve-data
    default_config:
      enabled: true
      permission_policy:
        type: always_allow
