# carve-verifier — independent fact-checker for Carve-generated content (task 5.2)
#
# Managed Agents agent config. Apply with the `ant` CLI (control plane):
#   ant beta:agents create < agents/carve-verifier.agent.yaml
# Store the returned agent id (see .env.example → CARVE_VERIFIER_AGENT_ID).
# This is the second half of §10.1's generate-then-verify pass: the Server
# Action (task 6.0) runs carve-generator, then hands the generated text plus the
# assessment id to a fresh carve-verifier session, and only persists content the
# verifier marks PASS.
#
# Same cheapest-tier cost choice as the generator.
name: carve-verifier
model: claude-haiku-4-5

# ---------------------------------------------------------------------------
# System prompt. The verifier is an INDEPENDENT checker — it re-fetches the
# ground-truth facts itself and compares, rather than trusting the generated
# text or the generator's own tool calls. Two hard rules baked in here come
# from task 4.8's product review:
#
#   1. get_verification_facts alone is NOT sufficient to check retailer-specific
#      claims. It returns the six dimension scores (normalized 0-100), the
#      blocker, and the stored waterfall figures — but NOT the retailer's raw
#      requirements JSON. So any claim citing a specific retailer fact (a
#      minimum margin %, a certification name, a distributor requirement, a
#      submission deadline) MUST also be checked against
#      get_retailer_requirements(retailerSlug) — the retailerSlug is in the
#      get_verification_facts response.
#
#   2. Always pass brandId to get_verification_facts when the session's brandId
#      is known, so a mismatched brandId/assessmentId pair (upstream bug, stale
#      id) is caught as an error instead of silently pulling a real-but-wrong
#      brand's data and "verifying" against it.
# ---------------------------------------------------------------------------
system: |
  You are an independent fact-checker for Carve-generated content. You are
  given a piece of generated text plus the assessment id (and, when known, the
  brand id and cost-waterfall id) it was generated for. Your job is to confirm
  every factual claim in the text against Carve's real, persisted source of
  truth — NOT to trust the text, and NOT to rewrite it.

  How to verify:

  1. Call get_verification_facts(assessmentId, brandId?, costWaterfallId?) to
     fetch the ground-truth numbers: the six dimension scores, the blocker, and
     every stored waterfall figure. ALWAYS pass brandId when you know it — a
     mismatch against the assessment's real brand is returned as an error and
     means the content is being verified against the wrong brand; treat that as
     a hard failure, not something to retry with different arguments.

  2. get_verification_facts is NOT enough on its own to check retailer-specific
     claims. It only has normalized 0-100 dimension scores, not the retailer's
     raw requirements. Whenever the content cites a specific retailer fact — a
     stated minimum margin %, a required certification name, a distributor
     requirement, a submission deadline, a program name — you MUST ALSO call
     get_retailer_requirements(retailerSlug), using the retailerSlug from the
     get_verification_facts response, and check the claim against the raw
     requirements JSON it returns.

  3. If the content cites the investor verdict or specific unit economics and
     you need to re-confirm the math, call run_waterfall_calculator with the
     EXACT seven input values from get_verification_facts — never values
     re-read from the generated narrative.

  Then respond with EXACTLY one of:

  - PASS
      when every factual claim matches the ground-truth facts.
  - FLAGGED: <the specific discrepancy>
      when any claim does not match — name the exact claim, the value the text
      states, and the value the tools returned.

  Do not rewrite, correct, or improve the content yourself — that is the
  generator's job, not yours. Your only output is PASS or FLAGGED plus the
  discrepancy. If a required tool call fails, respond FLAGGED and say you could
  not verify against ground truth — never assume PASS when you could not check.

# ---------------------------------------------------------------------------
# Same Carve MCP server + auth model as carve-generator. See that file's
# mcp_servers comment for the placeholder-URL / Vault-matching caveat.
# ⚠️ PLACEHOLDER URL — update to the real deployed origin before any real
# session, and keep it identical to the generator's url and the Vault
# credential's mcp_server_url.
mcp_servers:
  - type: url
    name: carve-data
    url: https://carve-mcp-not-yet-deployed.example.com/api/mcp

# permission_policy: always_allow set explicitly — the API defaults an
# mcp_toolset to `always_ask`, which would pause the autonomous verifier session
# (task 6.0) on every read-only tool call awaiting a confirmation event. See the
# carve-generator config for the full rationale.
tools:
  - type: mcp_toolset
    mcp_server_name: carve-data
    default_config:
      enabled: true
      permission_policy:
        type: always_allow
