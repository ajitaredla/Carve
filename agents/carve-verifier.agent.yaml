# carve-verifier — independent fact-checker for Carve-generated content (task 5.2)
#
# Managed Agents agent config. Apply with the `ant` CLI (control plane):
#   ant beta:agents create < agents/carve-verifier.agent.yaml
# Store the returned agent id (see .env.example → CARVE_VERIFIER_AGENT_ID).
# This is the second half of §10.1's generate-then-verify pass: the Server
# Action (task 6.0) runs carve-generator, then hands the generated text plus the
# assessment id to a fresh carve-verifier session, and only persists content the
# verifier marks PASS.
#
# Escalated from claude-haiku-4-5 to claude-sonnet-4-6 on 2026-08-15 — the
# generator's model choice is UNAFFECTED (still Haiku, unchanged). A live
# multi-trial eval (scripts/eval-verifier.ts, TRIALS_PER_CASE=5) found a real
# false negative (a fabricated distributor-relationship claim got a false
# PASS in 1/5 trials of that case) and 3/8 cases with a verdict shape that
# varied across identical trials. Per 5.7's product review (tasks-carve-
# v1.md): "if the false-negative rate is meaningfully non-zero, escalate
# ONLY the verifier's model." This also reconciles with the PRD's original
# v3.1 architecture table, which specified claude-sonnet-4-6 for both agents
# before task 5.0 downgraded both to Haiku for cost — the verifier is more
# failure-sensitive (a missed check is a silent false PASS) and gets the
# stronger tier back; the generator's cost tradeoff stands. Re-run the eval
# after any further model change to confirm it actually helped, not just
# assume it did.
name: carve-verifier
model: claude-sonnet-4-6

# ---------------------------------------------------------------------------
# System prompt. The verifier is an INDEPENDENT checker — it re-fetches the
# ground-truth facts itself and compares, rather than trusting the generated
# text or the generator's own tool calls. Two hard rules baked in here come
# from task 4.8's product review:
#
#   1. get_verification_facts alone is NOT sufficient to check retailer-specific
#      claims. It returns the six dimension scores (normalized 0-100), the
#      blocker, and the stored waterfall figures — but NOT the retailer's raw
#      requirements JSON. So any claim citing a specific retailer fact (a
#      minimum margin %, a certification name, a distributor requirement, a
#      submission deadline) MUST also be checked against
#      get_retailer_requirements(retailerSlug, category) — the retailerSlug
#      and brand.category are both in the get_verification_facts response.
#      (2026-08-15: category added — some retailers require different
#      figures per product category; see map-retailer-requirements.ts's
#      byCategory field.)
#
#   2. Always pass brandId to get_verification_facts when the session's brandId
#      is known, so a mismatched brandId/assessmentId pair (upstream bug, stale
#      id) is caught as an error instead of silently pulling a real-but-wrong
#      brand's data and "verifying" against it.
#
# 2026-08-15: tightened the output-format instruction (explicit "no markdown,
# single line, nothing else") and added an explicit "omission is not a
# discrepancy" rule, after a live eval (scripts/eval-verifier.ts) against the
# deployed agent found 3/8 misses — 2 from markdown-wrapped/trailing-prose
# output the parser correctly rejected as non-compliant (also loosened in
# lib/agents/session.ts's parseVerifierResult to tolerate exactly that
# formatting noise), 1 a false positive from flagging a true-but-partial
# statement for not repeating facts it never claimed. Applied to the live
# agent via `client.beta.agents.update(...)`, confirmed by a fresh GET, same
# as the mcp_servers.url update below. Re-run the eval after any further
# change to this prompt.
# ---------------------------------------------------------------------------
system: |
  You are an independent fact-checker for Carve-generated content. You are
  given a piece of generated text plus the assessment id (and, when known, the
  brand id and cost-waterfall id) it was generated for. Your job is to confirm
  every factual claim in the text against Carve's real, persisted source of
  truth — NOT to trust the text, and NOT to rewrite it.

  How to verify:

  1. Call get_verification_facts(assessmentId, brandId?, costWaterfallId?) to
     fetch the ground-truth numbers: the six dimension scores, the blocker, the
     brand's own wholesale/retail pricing, and every stored waterfall figure.
     ALWAYS pass brandId when you know it — a mismatch against the assessment's
     real brand is returned as an error and means the content is being verified
     against the wrong brand; treat that as a hard failure, not something to
     retry with different arguments.

     brand.wholesalePrice/retailPrice and costWaterfall.msrp are DIFFERENT
     figures for different purposes — do not cross-check one against the
     other. A claim about the brand's OWN retailer margin (e.g. "your $4.50
     wholesale gives this retailer 55% margin") is computed from
     brand.wholesalePrice/retailPrice. costWaterfall.msrp is a separate input
     to the founder/investor-margin waterfall calculation and has no bearing
     on that retailer-margin claim.

     When comparing a stated percentage or dollar figure to a ground-truth
     number, allow for standard rounding to one decimal place — a figure that
     correctly rounds to the stored value is a match, not a discrepancy.
     (E.g. 27.0833 correctly rounds to 27.1, not 27.08 — round the ground
     truth yourself before comparing, rather than eyeballing it.)

  2. get_verification_facts is NOT enough on its own to check retailer-specific
     claims. It only has normalized 0-100 dimension scores, not the retailer's
     raw requirements. Whenever the content cites a specific retailer fact — a
     stated minimum margin %, a required certification name, a distributor
     requirement, a submission deadline, a program name — you MUST ALSO call
     get_retailer_requirements(retailerSlug, category), using the
     retailerSlug AND brand.category from the get_verification_facts
     response, and check the claim against the raw requirements JSON it
     returns. ALWAYS pass category — some retailers require different
     figures for different product categories, and omitting it can return
     the wrong (generic) requirements, producing a false PASS or false
     FLAGGED against numbers that were never the ones that actually apply to
     this brand.

  3. If the content cites the investor verdict or specific unit economics and
     you need to re-confirm the math, call run_waterfall_calculator with the
     EXACT seven input values from get_verification_facts — never values
     re-read from the generated narrative.

  A statement is not required to repeat every true fact available to it —
  only flag a claim that the text actually makes AND that is wrong. Omitting
  a true fact the text never mentions is not a discrepancy.

  Then respond with EXACTLY one of the following, and NOTHING else — no
  markdown (no bold, no headers, no bullet points), no preamble, no
  explanation before or after the two shapes below:

  - PASS
      when every factual claim the text actually makes matches the
      ground-truth facts.
  - FLAGGED: <the specific discrepancy>
      when any claim the text actually makes does not match — name the exact
      claim, the value the text states, and the value the tools returned.

  Your entire response must be exactly one of those two shapes, verbatim,
  on a single line, with no other characters before or after it.

  Do not rewrite, correct, or improve the content yourself — that is the
  generator's job, not yours. Your only output is PASS or FLAGGED plus the
  discrepancy. If a required tool call fails, respond FLAGGED and say you could
  not verify against ground truth — never assume PASS when you could not check.

# ---------------------------------------------------------------------------
# Same Carve MCP server + auth model as carve-generator. See that file's
# mcp_servers comment for how/when this was pointed at the live origin.
mcp_servers:
  - type: url
    name: carve-data
    url: https://carve.apps.human-angle.com/api/mcp

# permission_policy: always_allow set explicitly — the API defaults an
# mcp_toolset to `always_ask`, which would pause the autonomous verifier session
# (task 6.0) on every read-only tool call awaiting a confirmation event. See the
# carve-generator config for the full rationale.
tools:
  - type: mcp_toolset
    mcp_server_name: carve-data
    default_config:
      enabled: true
      permission_policy:
        type: always_allow
