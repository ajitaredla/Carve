name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push image in Azure Container Registry
        run: |
          az acr build --registry "${{ vars.ACR_NAME }}" \
            --image "${{ vars.STUDENT }}/web:${{ github.sha }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            .
      - name: Sync app config
        run: |
          az containerapp secret set \
            --resource-group rg-students-platform \
            --name "ca-${{ vars.STUDENT }}" \
            --secrets \
              anthropic-api-key="${{ secrets.ANTHROPIC_API_KEY }}" \
              carve-environment-id="${{ secrets.CARVE_ENVIRONMENT_ID }}" \
              carve-generator-agent-id="${{ secrets.CARVE_GENERATOR_AGENT_ID }}" \
              carve-verifier-agent-id="${{ secrets.CARVE_VERIFIER_AGENT_ID }}" \
              carve-vault-id="${{ secrets.CARVE_VAULT_ID }}" \
              mcp-server-token="${{ secrets.MCP_SERVER_TOKEN }}" \
              cron-secret="${{ secrets.CRON_SECRET }}" \
              carve-scout-deployment-id="${{ secrets.CARVE_SCOUT_DEPLOYMENT_ID }}" \
              resend-api-key="${{ secrets.RESEND_API_KEY }}" \
              resend-from-email="${{ secrets.RESEND_FROM_EMAIL }}"
          az containerapp update \
            --resource-group rg-students-platform \
            --name "ca-${{ vars.STUDENT }}" \
            --set-env-vars \
              ANTHROPIC_API_KEY=secretref:anthropic-api-key \
              CARVE_ENVIRONMENT_ID=secretref:carve-environment-id \
              CARVE_GENERATOR_AGENT_ID=secretref:carve-generator-agent-id \
              CARVE_VERIFIER_AGENT_ID=secretref:carve-verifier-agent-id \
              CARVE_VAULT_ID=secretref:carve-vault-id \
              MCP_SERVER_TOKEN=secretref:mcp-server-token \
              CRON_SECRET=secretref:cron-secret \
              CARVE_SCOUT_DEPLOYMENT_ID=secretref:carve-scout-deployment-id \
              RESEND_API_KEY=secretref:resend-api-key \
              RESEND_FROM_EMAIL=secretref:resend-from-email
      - name: Deploy the immutable image
        run: |
          az containerapp update \
            --resource-group rg-students-platform \
            --name "ca-${{ vars.STUDENT }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/${{ vars.STUDENT }}/web:${{ github.sha }}"
      - name: Restart to pick up current secret values
        run: |
          # A secretref pointing at an unchanged secret NAME isn't itself a
          # revision-defining change, so `secret set` above can land after
          # the image-triggered revision has already started and cached the
          # old value. An explicit restart guarantees the active revision
          # boots with whatever the secret store holds right now.
          REVISION=$(az containerapp show \
            --resource-group rg-students-platform \
            --name "ca-${{ vars.STUDENT }}" \
            --query "properties.latestRevisionName" -o tsv)
          az containerapp revision restart \
            --resource-group rg-students-platform \
            --name "ca-${{ vars.STUDENT }}" \
            --revision "$REVISION"
